name: Deploy Modal Pipelines

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-deploy
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  deploy:
    name: Deploy Modal apps
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Validate branch
        if: github.ref_name != 'main' && github.ref_name != 'staging'
        run: |
          echo "Unsupported deployment branch: ${{ github.ref_name }}"
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Modal CLI
        run: python -m pip install --upgrade pip modal

      - name: Resolve Modal environment
        id: modal-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Modal pipelines
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          deploy_modal() {
            local path="$1"
            local label="$2"

            for attempt in 1 2 3; do
              echo "Deploying ${label} (attempt ${attempt}/3)"
              if modal deploy "$path" --env "${{ steps.modal-env.outputs.name }}"; then
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 30))
              fi
            done

            echo "Failed to deploy ${label} after 3 attempts"
            return 1
          }

          deploy_modal modal_processing/main.py "processing pipeline"
          deploy_modal modal_smart_video/main.py "smart video pipeline"
          deploy_modal modal_social_post/main.py "social post pipeline"
          deploy_modal modal_review/main.py "review pipeline"
